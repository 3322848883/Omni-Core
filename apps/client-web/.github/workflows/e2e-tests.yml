name: E2E Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/client-web/**'
      - 'apps/client-api/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/client-web/**'
      - 'apps/client-api/**'

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fgvpn_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies (Client API)
      working-directory: ./apps/client-api
      run: npm ci

    - name: Install dependencies (Client Web)
      working-directory: ./apps/client-web
      run: npm ci

    - name: Install Playwright
      working-directory: ./apps/client-web
      run: npx playwright install --with-deps

    - name: Setup database
      working-directory: ./apps/client-api
      run: |
        npm run migrate:latest
        npm run seed:test
      env:
        DB_HOST: localhost
        DB_PORT: 3306
        DB_NAME: fgvpn_test
        DB_USER: test
        DB_PASSWORD: test123
        REDIS_HOST: localhost
        REDIS_PORT: 6379

    - name: Start API server
      working-directory: ./apps/client-api
      run: npm run dev &
      env:
        NODE_ENV: test
        PORT: 3002
        DB_HOST: localhost
        DB_PORT: 3306
        DB_NAME: fgvpn_test
        DB_USER: test
        DB_PASSWORD: test123
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        JWT_SECRET: test-secret-key

    - name: Wait for API server
      run: |
        npx wait-on http://localhost:3002/health --timeout 60000

    - name: Run E2E tests
      working-directory: ./apps/client-web
      run: npx playwright test
      env:
        BASE_URL: http://localhost:5173
        API_URL: http://localhost:3002

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          apps/client-web/playwright-report/
          apps/client-web/test-results/
        retention-days: 30

    - name: Upload screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: screenshots
        path: apps/client-web/test-results/**/*.png
        retention-days: 7

    - name: Upload videos
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: videos
        path: apps/client-web/test-results/**/*.webm
        retention-days: 7
