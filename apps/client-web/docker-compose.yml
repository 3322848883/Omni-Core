# ============================================
# FGVPN Client Web - Docker Compose
# Local development and production simulation
# ============================================

version: '3.8'

services:
  # ============================================
  # Development Service
  # ============================================
  client-web-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: fgvpn-client-web-dev
    ports:
      - "5174:5174"
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      # Exclude node_modules
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    networks:
      - fgvpn-network
    profiles:
      - dev

  # ============================================
  # Production Service
  # ============================================
  client-web-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        ENV_FILE: .env.production
    container_name: fgvpn-client-web-prod
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    networks:
      - fgvpn-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - prod

  # ============================================
  # Staging Service
  # ============================================
  client-web-staging:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        ENV_FILE: .env.staging
    container_name: fgvpn-client-web-staging
    ports:
      - "8081:8080"
    environment:
      - NODE_ENV=staging
    networks:
      - fgvpn-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - staging

  # ============================================
  # Nginx Reverse Proxy (optional)
  # ============================================
  nginx:
    image: nginx:1.25-alpine
    container_name: fgvpn-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - client-web-prod
    networks:
      - fgvpn-network
    restart: unless-stopped
    profiles:
      - proxy

networks:
  fgvpn-network:
    driver: bridge
    name: fgvpn-network
