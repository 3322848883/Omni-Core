<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="novaGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <filter id="novaGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer rings with pulse animation -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#f59e0b" stroke-width="0.5" opacity="0.3">
    <animate attributeName="r" values="45;48;45" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="50" r="35" fill="none" stroke="#f59e0b" stroke-width="0.5" opacity="0.2">
    <animate attributeName="r" values="35;38;35" dur="3s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  
  <!-- Rotating outer ring -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="20s" repeatCount="indefinite"/>
    <path d="M 50 5 L 53 18 L 50 15 L 47 18 Z" fill="#f59e0b"/>
    <path d="M 95 50 L 82 53 L 85 50 L 82 47 Z" fill="#f59e0b"/>
    <path d="M 50 95 L 47 82 L 50 85 L 53 82 Z" fill="#f59e0b"/>
    <path d="M 5 50 L 18 47 L 15 50 L 18 53 Z" fill="#f59e0b"/>
  </g>
  
  <!-- Core with glow and pulse -->
  <circle cx="50" cy="50" r="20" fill="url(#novaGrad)" filter="url(#novaGlow)">
    <animate attributeName="r" values="20;22;20" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Inner rotating elements -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 50 50" to="0 50 50" dur="10s" repeatCount="indefinite"/>
    <circle cx="50" cy="30" r="2" fill="#f59e0b" opacity="0.6"/>
    <circle cx="70" cy="50" r="2" fill="#f59e0b" opacity="0.6"/>
    <circle cx="50" cy="70" r="2" fill="#f59e0b" opacity="0.6"/>
    <circle cx="30" cy="50" r="2" fill="#f59e0b" opacity="0.6"/>
  </g>
</svg>