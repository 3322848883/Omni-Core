version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: omnicore-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: omnicore_admin
      MYSQL_USER: omnicore
      MYSQL_PASSWORD: omnicore_password
    volumes:
      - E:/DockerData/mysql:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: omnicore-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - E:/DockerData/redis:/data
    command: redis-server --appendonly yes

  # 可选：phpMyAdmin 管理界面
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: omnicore-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root_password
    depends_on:
      - mysql

  # RabbitMQ 消息队列
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: omnicore-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: omnicore
      RABBITMQ_DEFAULT_PASS: omnicore_password
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - E:/DockerData/rabbitmq:/var/lib/rabbitmq
