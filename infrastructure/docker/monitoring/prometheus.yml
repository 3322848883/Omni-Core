global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: fgvpn
    replica: '{{.ExternalURL}}'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # MySQL Exporter
  - job_name: 'mysql-exporter'
    static_configs:
      - targets: ['mysql-exporter:9104']

  # Redis Exporter
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  # Admin API
  - job_name: 'admin-api'
    static_configs:
      - targets: ['admin-api:3001']
    metrics_path: /metrics

  # Client API
  - job_name: 'client-api'
    static_configs:
      - targets: ['client-api:3002']
    metrics_path: /metrics

  # Xray
  - job_name: 'xray'
    static_configs:
      - targets: ['xray:10085']
    metrics_path: /debug/vars
